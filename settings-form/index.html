<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="settings-card">
    <header class="settings-header">
      <h1>Settings</h1>
      <p>Manage your account profile and notification preferences.</p>
    </header>

    <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

    <form id="settings-form" novalidate>
      <div class="form-group">
        <label for="display-name">Display Name</label>
        <input 
          type="text" 
          id="display-name" 
          name="displayName" 
          autocomplete="name"
          aria-describedby="display-name-error"
          aria-invalid="false"
          required
        >
        <span class="error-message" id="display-name-error" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          autocomplete="email"
          aria-describedby="email-error"
          aria-invalid="false"
          required
        >
        <span class="error-message" id="email-error" aria-live="polite"></span>
      </div>

      <div class="form-group checkbox-group">
        <input 
          type="checkbox" 
          id="notifications" 
          name="notifications"
        >
        <label for="notifications">Receive email notifications</label>
      </div>

      <div class="form-actions">
        <button type="submit" id="save-button" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
