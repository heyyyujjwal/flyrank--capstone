<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1>Account Settings</h1>
      <p>Manage your account preferences, profile details, and notifications.</p>
    </header>

    <div id="status-message" class="status-message" role="alert" aria-live="polite" hidden></div>

    <form id="settings-form" novalidate>
      <!-- Profile Section -->
      <section class="form-section">
        <h2>Profile Information</h2>

        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="e.g. jdoe" 
            autocomplete="username"
            required 
            minlength="3" 
            maxlength="20"
          >
          <span class="error-message" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="e.g. user@example.com" 
            autocomplete="email"
            required
          >
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="bio">Bio</label>
          <textarea 
            id="bio" 
            name="bio" 
            rows="3" 
            placeholder="Tell us a little about yourself..."
            maxlength="200"
          ></textarea>
          <span class="character-count" id="bio-count">0 / 200</span>
          <span class="error-message" id="bio-error"></span>
        </div>
      </section>

      <!-- Preferences Section -->
      <section class="form-section">
        <h2>Preferences</h2>

        <div class="form-group">
          <label for="theme">Interface Theme</label>
          <select id="theme" name="theme">
            <option value="system">System Default</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <div class="form-group">
          <label for="language">Language</label>
          <select id="language" name="language">
            <option value="en">English (US)</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </section>

      <!-- Notifications & Privacy Section -->
      <section class="form-section">
        <h2>Notifications & Privacy</h2>

        <div class="checkbox-group">
          <label class="checkbox-label" for="email-notifications">
            <input type="checkbox" id="email-notifications" name="emailNotifications" checked>
            <span>Receive email notifications for updates</span>
          </label>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label" for="marketing-emails">
            <input type="checkbox" id="marketing-emails" name="marketingEmails">
            <span>Subscribe to product newsletter</span>
          </label>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label" for="public-profile">
            <input type="checkbox" id="public-profile" name="publicProfile" checked>
            <span>Make profile visible to public</span>
          </label>
        </div>
      </section>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="submit" id="save-button" class="btn btn-primary">Save Changes</button>
        <button type="reset" id="reset-button" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
